<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>YouTube Player</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: #111;
      color: #fff;
    }

    body {
      display: flex;
      justify-content: center;
      padding: 24px 12px;
    }

    .app {
      width: min(900px, 100%);
    }

    h1 {
      margin: 0 0 20px;
      font-size: clamp(24px, 5vw, 36px);
    }

    .search-box {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .search-box input {
      flex: 1;
      min-width: 0;
      padding: 12px 14px;
      border: 1px solid #444;
      border-radius: 8px;
      background: #222;
      color: #fff;
      font-size: 16px;
      outline: none;
    }

    .search-box button {
      padding: 12px 18px;
      border: 0;
      border-radius: 8px;
      background: #fff;
      color: #111;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .search-box button:hover {
      opacity: 0.85;
    }

    .status {
      margin-top: 16px;
      color: #aaa;
      min-height: 24px;
    }

    .results {
      display: grid;
      gap: 12px;
      margin-top: 20px;
    }

    .result {
      display: flex;
      gap: 12px;
      width: 100%;
      padding: 10px;
      border: 1px solid #333;
      border-radius: 10px;
      background: #1b1b1b;
      cursor: pointer;
    }

    .result:hover {
      background: #252525;
    }

    .thumbnail {
      width: 160px;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-radius: 6px;
      background: #333;
      flex-shrink: 0;
    }

    .result-title {
      margin: 4px 0;
      font-size: 16px;
      line-height: 1.4;
    }

    .player {
      margin-top: 24px;
    }

    video {
      display: block;
      width: 100%;
      max-height: 70vh;
      background: #000;
      border-radius: 10px;
    }

    .video-title {
      margin-top: 12px;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.4;
    }

    @media (max-width: 600px) {
      body {
        padding: 16px 8px;
      }

      .search-box {
        flex-direction: column;
      }

      .search-box button {
        width: 100%;
      }

      .result {
        flex-direction: column;
      }

      .thumbnail {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <h1>YouTube Player</h1>

    <div class="search-box">
      <input
        id="searchInput"
        type="text"
        placeholder="YouTube URLを入力"
        autocomplete="off"
      >

      <button id="searchButton">
        検索
      </button>
    </div>

    <div id="status" class="status">
      準備完了
    </div>

    <section id="results" class="results"></section>

    <section class="player">
      <video id="video" controls playsinline></video>

      <div id="videoTitle" class="video-title"></div>
    </section>

  </main>
<script src="./app.js"></script>


</body>
</html>
