<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>YouTube自作プレイヤー</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; background: #1a1a1a; color: #fff; }
        .input-area { margin-bottom: 20px; display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; font-size: 16px; border: none; border-radius: 4px; background: #333; color: #fff; }
        button { padding: 12px 24px; font-size: 16px; border: none; border-radius: 4px; background: #ff0000; color: #fff; cursor: pointer; font-weight: bold; }
        button:hover { background: #cc0000; }
        video { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <h2>YouTube動画再生プレイヤー</h2>

    <!-- 1. URLを入力する場所 -->
    <div class="input-area">
        <input type="text" id="video-url" placeholder="YouTubeのURLを貼り付けてください（例: https://youtube.com）">
        <button onclick="loadAndPlay()">再生</button>
    </div>

    <!-- 2. プレイヤー本体 -->
    <video id="my-player" controls crossorigin="anonymous"></video>

    <script>
        // ⚠️【注意】あなたのCloudflareのURLを入れてください（末尾の「/」は消してください）
        const proxyBaseUrl = "https://youtube-player.ahahadane.workers.dev
"; 

        function loadAndPlay() {
            const inputUrl = document.getElementById('video-url').value.trim();
            const player = document.getElementById('my-player');

            if (!inputUrl) {
                alert("URLを入力してください");
                return;
            }

            // JavaScriptの安全なエンコードを使い、「?url=全体のURL」の形でCloudflareに丸投げする
            const encodedUrl = encodeURIComponent(inputUrl);
            const finalStreamUrl = `${proxyBaseUrl}/?url=${encodedUrl}`;

            // プレイヤーにURLを設定して再生
            player.src = finalStreamUrl;
            player.load(); // 動画データをリセットして読み込み直す
            
            player.play().catch(err => {
                console.log("自動再生がブロックされました。再生ボタンを押してください:", err);
            });
        }
    </script>

</body>
</html>
