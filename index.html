<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>YouTube再生テスト</title>
</head>
<body>

    <!-- 1. 動画を表示するプレイヤー（横幅100%） -->
    <video id="my-player" controls width="100%" height="auto">
        動画を再生できません。
    </video>

    <script>
        // 2. あなたが作ったCloudflareのURLに書き換えてください
        const proxyBaseUrl = "https://workers.dev"; 
        
        // 3. 再生したいYouTubeの動画IDを指定します
        const videoId = "dQw4w9WgXcQ"; 

        // 4. プロキシのURLを組み立てて、プレイヤーにセットする
        const player = document.getElementById('my-player');
        player.src = `${proxyBaseUrl}?v=${videoId}`;
    </script>

</body>
</html>
