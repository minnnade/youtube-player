<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>YouTube再生テスト</title>
</head>
<body>

    <!-- crossorigin="anonymous" を入れてCORSエラーを防ぐ -->
    <video id="my-player" controls width="100%" height="auto" crossorigin="anonymous"></video>

    <script>
        // ⚠️【注意】あなたのCloudflareのURLを入れてください（末尾の / は消してください）
        const proxyBaseUrl = "https://pages.dev"; 
        
        // 再生したいYouTubeの動画ID
        const videoId = "dQw4w9WgXcQ"; 

        // URLの後ろに「?v=動画ID」をくっつける
        const player = document.getElementById('my-player');
        player.src = `${proxyBaseUrl}/?v=${videoId}`;
    </script>

</body>
</html>
